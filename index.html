<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Love ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#app {
    width: 100vw;
    height: 100vh;
}

.message {
    position: fixed;
    top: 35px;
    left: 50%;
    transform: translateX(-50%);
    color: #ff77bb;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    z-index: 10;
    text-shadow:
        0 0 5px #ff1493,
        0 0 15px #ff1493,
        0 0 30px #ff1493;
}

.name {
    font-size: 32px;
    margin-top: 8px;
}

.hint {
    position: fixed;
    bottom: 25px;
    width: 100%;
    text-align: center;
    color: #ffb6dc;
    font-size: 13px;
    z-index: 10;
}
</style>
</head>

<body>

<div id="app"></div>

<div class="message">
    HAPPY BIRTHDAY ❤️
    <div class="name">MY LOVE</div>
</div>

<div class="hint">
    ❤️ FOR YOU, WITH LOVE ❤️
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 5, 28);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

document.getElementById("app").appendChild(renderer.domElement);


// =====================================
// LIGHT
// =====================================

const ambientLight = new THREE.AmbientLight(0xff55aa, 2);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(
    0xff1493,
    5,
    100
);

pointLight.position.set(0, 5, 10);
scene.add(pointLight);


// =====================================
// HEART SHAPE
// =====================================

const heartShape = new THREE.Shape();

heartShape.moveTo(0, 1.5);

heartShape.bezierCurveTo(
    -2.5, 4,
    -6, 1.5,
    0, -3
);

heartShape.bezierCurveTo(
    6, 1.5,
    2.5, 4,
    0, 1.5
);

const heartGeometry =
    new THREE.ExtrudeGeometry(
        heartShape,
        {
            depth: 1,
            bevelEnabled: true,
            bevelSegments: 5,
            steps: 2,
            bevelSize: 0.15,
            bevelThickness: 0.15
        }
    );

heartGeometry.center();


// =====================================
// HEART MATERIAL
// =====================================

const heartMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xff1493,
        emissive: 0xff0066,
        emissiveIntensity: 2,
        metalness: 0.2,
        roughness: 0.25
    });

const heart =
    new THREE.Mesh(
        heartGeometry,
        heartMaterial
    );

heart.scale.set(0.8, 0.8, 0.8);

scene.add(heart);


// =====================================
// HEART GLOW
// =====================================

const glowGeometry =
    new THREE.SphereGeometry(5, 32, 32);

const glowMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xff1493,
        transparent: true,
        opacity: 0.08
    });

const glow =
    new THREE.Mesh(
        glowGeometry,
        glowMaterial
    );

scene.add(glow);


// =====================================
// PARTICLES
// =====================================

const particleCount = 2500;

const particleGeometry =
    new THREE.BufferGeometry();

const positions = [];

for (let i = 0; i < particleCount; i++) {

    const radius =
        7 + Math.random() * 13;

    const angle =
        Math.random() * Math.PI * 2;

    const y =
        (Math.random() - 0.5) * 7;

    const x =
        Math.cos(angle) * radius;

    const z =
        Math.sin(angle) * radius;

    positions.push(x, y, z);
}

particleGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        positions,
        3
    )
);

const particleMaterial =
    new THREE.PointsMaterial({
        color: 0xff4da6,
        size: 0.08,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
    });

const particles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );

scene.add(particles);


// =====================================
// HEART PARTICLES
// =====================================

const heartParticles = [];

for (let i = 0; i < 500; i++) {

    const t =
        Math.random() * Math.PI * 2;

    const x =
        8 * Math.pow(Math.sin(t), 3);

    const y =
        6 * Math.cos(t)
        - 2.5 * Math.cos(2*t)
        - Math.cos(3*t)
        - 0.5 * Math.cos(4*t);

    const z =
        (Math.random() - 0.5) * 1.5;

    const geometry =
        new THREE.SphereGeometry(
            0.025,
            5,
            5
        );

    const material =
        new THREE.MeshBasicMaterial({
            color: 0xff66b3
        });

    const p =
        new THREE.Mesh(
            geometry,
            material
        );

    p.position.set(
        x * 0.35,
        y * 0.35 + 3,
        z
    );

    scene.add(p);

    heartParticles.push(p);
}


// =====================================
// RING
// =====================================

const ringGeometry =
    new THREE.TorusGeometry(
        7,
        0.025,
        8,
        150
    );

const ringMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xff1493,
        transparent: true,
        opacity: 0.8
    });

const ring =
    new THREE.Mesh(
        ringGeometry,
        ringMaterial
    );

ring.rotation.x =
    Math.PI / 2;

ring.position.y = -2;

scene.add(ring);


// =====================================
// TEXT SPRITES
// =====================================

function createText(text, size) {

    const canvas =
        document.createElement("canvas");

    const ctx =
        canvas.getContext("2d");

    canvas.width = 512;
    canvas.height = 128;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.font =
        `bold ${size}px Arial`;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#ff8ac7";

    ctx.shadowColor = "#ff1493";
    ctx.shadowBlur = 20;

    ctx.fillText(
        text,
        canvas.width / 2,
        canvas.height / 2
    );

    const texture =
        new THREE.CanvasTexture(canvas);

    const material =
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true
        });

    const sprite =
        new THREE.Sprite(material);

    sprite.scale.set(8, 2, 1);

    return sprite;
}


const texts = [
    "AMOR DE MI VIDA ❤️",
    "TE AMO ❤️",
    "HAPPY BIRTHDAY ❤️",
    "FOREVER WITH YOU ❤️",
    "LOVE YOU ALWAYS ❤️"
];

const textSprites = [];

texts.forEach((text, i) => {

    const sprite =
        createText(text, 42);

    const angle =
        (i / texts.length)
        * Math.PI * 2;

    const radius = 8;

    sprite.position.set(
        Math.cos(angle) * radius,
        -1.5,
        Math.sin(angle) * radius
    );

    scene.add(sprite);

    textSprites.push({
        sprite: sprite,
        angle: angle
    });
});


// =====================================
// ANIMATION
// =====================================

let time = 0;

function animate() {

    requestAnimationFrame(animate);

    time += 0.01;

    // หัวใจหมุน
    heart.rotation.y =
        Math.sin(time * 0.7) * 0.25;

    heart.rotation.z =
        Math.sin(time * 0.5) * 0.08;


    // หัวใจเต้น
    const beat =
        1 + Math.sin(time * 4) * 0.06;

    heart.scale.set(
        0.8 * beat,
        0.8 * beat,
        0.8 * beat
    );


    // Glow
    glow.scale.set(
        1 + Math.sin(time * 2) * 0.1,
        1 + Math.sin(time * 2) * 0.1,
        1 + Math.sin(time * 2) * 0.1
    );


    // หมุนอนุภาค
    particles.rotation.y =
        time * 0.08;


    // หมุนวงแหวน
    ring.rotation.z =
        time * 0.3;


    // หมุนข้อความ
    textSprites.forEach(item => {

        item.angle += 0.002;

        const radius = 8;

        item.sprite.position.x =
            Math.cos(item.angle) * radius;

        item.sprite.position.z =
            Math.sin(item.angle) * radius;

        item.sprite.lookAt(camera.position);
    });


    // ลอยหัวใจอนุภาค
    heartParticles.forEach((p, i) => {

        p.position.y +=
            Math.sin(time * 2 + i) * 0.001;

    });


    renderer.render(
        scene,
        camera
    );
}

animate();


// =====================================
// RESPONSIVE
// =====================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
